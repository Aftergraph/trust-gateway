name: P2 trust-gateway owner evidence

on:
  pull_request:
    paths:
      - ".github/workflows/p2-trust-gateway-owner-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Governed Git boundary suite
        run: node --test --test-concurrency=1 tests/git-governed-egress.test.js tests/credential-surrogation-egress.test.js
      - name: Emit evidence
        env:
          OUT: ${{ runner.temp }}/owner-evidence.json
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          base={
            "schema":"steward.p2.owner-evidence/1.0",
            "owner":"Aftergraph/trust-gateway",
            "subject":os.environ["GITHUB_SHA"],
            "suite":"governed Git + credential surrogation",
            "result":"PASS",
            "production_effect":False,
          }
          canonical=json.dumps(base,sort_keys=True,separators=(",",":")).encode()
          base["content_sha256"]=hashlib.sha256(canonical).hexdigest()
          open(os.environ["OUT"],"w",encoding="utf-8").write(json.dumps(base,indent=2,sort_keys=True)+"\n")
          print(json.dumps(base,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-trust-gateway-owner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-evidence.json
          if-no-files-found: error
