name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Workspace contract: tests boot the AIE gateway subprocess and read
      # governance contracts, so those siblings must be materialized inside
      # the workspace (checkout paths must stay under $GITHUB_WORKSPACE).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/aie
          path: aie
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/after-graph-governance
          path: after-graph-governance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install python deps for AIE-boot tests
        run: pip install --quiet pyjwt
      - run: npm test
        env:
          AIE_RUNTIME_PATH: ${{ github.workspace }}/aie
          GOVERNANCE_DIR: ${{ github.workspace }}/after-graph-governance


  p2-live-readback:
    name: P2 live deployed-commit readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://trust-gateway.fly.dev/healthz
      EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
      EVIDENCE_OUT: ${{ runner.temp }}/trust-gateway-live-readback.json
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Probe deployed commit
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const response = await fetch(process.env.TARGET_URL, {
            redirect: 'error',
            headers: {
              accept: 'application/json',
              'user-agent': 'aftergraph-steward-p2-readback/1.0',
            },
          });
          const raw = await response.text();
          let body = null;
          try { body = JSON.parse(raw); } catch {}

          const deployed = body?.deployed_commit ?? null;
          const exact = typeof deployed === 'string' && /^[0-9a-f]{40}$/.test(deployed);
          const aligned = exact && deployed === process.env.EXPECTED_MAIN_SHA;
          const base = {
            schema: 'steward.p2.trust-gateway-live-readback/1.0',
            endpoint: process.env.TARGET_URL,
            http_status: response.status,
            response_ok: response.ok,
            deployed_commit: deployed,
            exact_commit_readback: exact,
            expected_main_sha: process.env.EXPECTED_MAIN_SHA,
            deployment_alignment: aligned ? 'CURRENT_MAIN' : 'STALE',
            production_effect: false,
          };
          const canonical = JSON.stringify(base, Object.keys(base).sort());
          const evidence = {
            ...base,
            content_sha256: crypto.createHash('sha256').update(canonical).digest('hex'),
          };
          fs.writeFileSync(process.env.EVIDENCE_OUT, JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));

          if (!response.ok) throw new Error('healthz_http_failure');
          if (!exact) throw new Error('deployed_commit_missing_or_invalid');
          if (!aligned) throw new Error('deployed_commit_not_current_main');
          NODE
      - name: Upload live readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-trust-gateway-live-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-gateway-live-readback.json
          if-no-files-found: error
