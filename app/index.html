<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trust Gateway — Operator Console</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/responsive.css">
<link rel="stylesheet" href="/desktop.css">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</head>
<body>
<header>
  <div class="brand">▲ Trust Gateway <span class="ver">v2</span></div>
  <nav id="tabs" class="tabs"></nav>
  <div class="statusbar">
    <span id="chainPill" class="pill sealed">…</span>
    <span class="muted">entries</span> <b id="entryCount">0</b>
    <span class="muted">pending</span> <b id="pendingCount">0</b>
    <span class="muted">head</span> <code id="headHash" class="hash">…</code>
    <span id="liveDot" class="dot off" title="SSE connection"></span>
  </div>
  <div class="tokenbox">
    <span id="tenantPicker"></span>
    <span id="authChip"></span>
    <span id="tenantChip" class="muted" title="tenant"></span>
    <input id="tokenInput" type="password" placeholder="bearer token" autocomplete="off">
    <button id="connectBtn">connect</button>
  </div>
</header>

<main class="panes">
  <section class="pane" id="paneStream">
    <h2>Live audit stream</h2>
    <div class="pane-body" id="stream"></div>
  </section>

  <section class="pane" id="panePending">
    <h2>Pending approvals</h2>
    <div class="pane-body" id="pending"><div class="empty">none</div></div>
  </section>

  <section class="pane" id="paneWorkforce">
    <h2>Workforce</h2>
    <div class="pane-body" id="bots"><div class="empty">connect a token</div></div>
    <div class="chatdock">
      <div id="chatLog" class="chatlog"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" placeholder="ask the console bot — e.g. status" autocomplete="off">
        <button type="submit">send</button>
      </form>
    </div>
  </section>
</main>

<footer class="foot muted">
  every action decided before it happens, sealed after · <a href="/home">marketing site</a> · <a href="/healthz">/healthz</a>
</footer>

<script src="/keys.js"></script>
<script src="/app.js"></script>
<script src="/auth.js"></script>
<script src="/tenant-picker.js"></script>
<script src="/compose.js"></script>
<script src="/panels/core.js"></script>
<script src="/panels/rooms.js"></script>
<script src="/panels/artifacts.js"></script>
<script src="/panels/computer.js"></script>
<script src="/panels/goals.js"></script>
<script src="/panels/builder.js"></script>
<script src="/panels/hub.js"></script>
<script src="/panels/providers.js"></script>
<script src="/panels/history.js"></script>
<script src="/panels/playground.js"></script>
<script src="/panels/voice.js"></script>
<script src="/panels/integrations.js"></script>
<script src="/panels/providers-live.js"></script>
<script src="/panels/agents-system.js"></script>
</body>
</html>
