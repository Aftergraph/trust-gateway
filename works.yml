# Proof-only WORKS pipeline for STEWARD P2 Runtime→WORKS→TG→AIE.
# DO NOT MERGE. Uses Trust Gateway's already-wired tg-ci VDS pool.
version: 1

work:
  steward-p2-tg-aie-proof:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: tg-ci

    nodes:
      proof:
        run: |
          set -euo pipefail
          export PATH=/opt/works/node-current/bin:$PATH

          command -v git
          command -v go
          command -v node
          command -v python3

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          git clone -q --filter=blob:none https://github.com/Aftergraph/STEWARD-by-Aftergraph.git "$root/steward"
          git -C "$root/steward" checkout -q e147bbac3e4244b358d68466314363cb71073ea2

          git clone -q --filter=blob:none https://github.com/Aftergraph/runtime.git "$root/runtime"
          git -C "$root/runtime" checkout -q d9c5efb3a74222326ec71b06d5c2df2d4215d68f

          git clone -q --filter=blob:none https://github.com/Aftergraph/works-execution.git "$root/works-execution"
          git -C "$root/works-execution" checkout -q 64cabe65bf210b2c65b525750acb45fc6d53894d

          git clone -q --filter=blob:none https://github.com/Aftergraph/trust-gateway.git "$root/trust-gateway-owner"
          git -C "$root/trust-gateway-owner" checkout -q 8a2c8d66a67d036227c77904844f105b39723f58

          git clone -q --filter=blob:none https://github.com/Aftergraph/aie.git "$root/aie"
          git -C "$root/aie" checkout -q 4e3514b936d2d65433b6c51901afb56908abd545

          bash "$root/steward/scripts/p2_tg_aie_cross_process_proof.sh" \
            "$root/runtime" \
            "$root/works-execution" \
            "$root/trust-gateway-owner" \
            "$root/aie" \
            d9c5efb3a74222326ec71b06d5c2df2d4215d68f \
            64cabe65bf210b2c65b525750acb45fc6d53894d \
            8a2c8d66a67d036227c77904844f105b39723f58 \
            4e3514b936d2d65433b6c51901afb56908abd545
        cache: false
        timeout_s: 1200
